title: User Added to Privileged Active Directory Group
id: 2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
status: production
description: >
  Detects an account being added to a highly privileged AD group (Domain
  Admins, Enterprise Admins, Schema Admins).
references:
  - https://attack.mitre.org/techniques/T1098/
author: Anh Phan
date: 2026-09-23
tags:
  - attack.privilege_escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
    Group_Name|contains:
      - 'Domain Admins'
      - 'Enterprise Admins'
      - 'Schema Admins'
      - 'Administrators'
  condition: selection
falsepositives:
  - Scheduled access reviews or onboarding tied to an approved change ticket
  - Break-glass emergency access account usage
level: critical
---
