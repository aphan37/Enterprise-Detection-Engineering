title: Large Outbound Data Transfer to External Destination
id: 5f6a7b8c-9d0e-1f2a-3b4c-5d6e7f8a9b0c
status: production
description: >
  Detects a single host transferring an abnormally large volume of data to
  an external destination within a short window.
references:
  - https://attack.mitre.org/techniques/T1041/
author: Anh Phan
date: 2026-09-23
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: proxy
detection:
  selection:
    dest_ip|not_cidr: '10.0.0.0/8'
  timeframe: 1h
  condition: selection | sum(bytes_out) by src_ip > 524288000
falsepositives:
  - Cloud backup jobs and sync clients (OneDrive, Google Drive, Veeam)
  - Video conferencing recordings or large file-share links
  - Software/OS update mirrors
level: critical
---
